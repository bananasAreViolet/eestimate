name: Update averages

# Manual: Actions tab > "Update averages" > Run workflow.
# Reads the polls from the Google Sheet, recomputes everything and commits data/averages.json to main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recompute the averages
        run: node engine/update-averages.cjs
      - name: Commit if anything changed
        run: |
          git config user.name "eestimate-bot"
          git config user.email "eestimate-bot@users.noreply.github.com"
          git add data/averages.json engine/frozen-house-effects.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update averages"
            git push
          fi
